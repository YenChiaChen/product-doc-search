:root {

  --fg: #161922; --muted: #5C6375; --line: #DADEE6;
  --accent: #3446D6; --accent-soft: #E4E7FB;
  --filter: #A85A12; --filter-soft: #FBEBD9;
  --vec: #0B8475; --vec-soft: #D6F1EC;
  --dim: #9AA0AE;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101218; --surface: #181B23; --sunken: #13151C;
  --fg: #E6E8EE; --muted: #9AA1B2; --line: #2A2F3B;
  --accent: #8592FF; --accent-soft: #232845;
  --filter: #E5A25E; --filter-soft: #3A2A1A;
  --vec: #41C9B2; --vec-soft: #143430;
  --dim: #5D6372; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #101218; --surface: #181B23; --sunken: #13151C;
  --fg: #E6E8EE; --muted: #9AA1B2; --line: #2A2F3B;
  --accent: #8592FF; --accent-soft: #232845;
  --filter: #E5A25E; --filter-soft: #3A2A1A;
  --vec: #41C9B2; --vec-soft: #143430;
  --dim: #5D6372; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-size: 26px; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.tabs { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; padding: 6px 16px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .lf::before { background: var(--filter); }
.legend .lv::before { background: var(--vec); }
.note { font-size: 13px; color: var(--muted); }

/* search bar */
.searchbar { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.searchrow { display: flex; gap: 8px; }
.searchrow input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
.searchrow button { font: inherit; font-weight: 700; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 3px 11px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; margin-top: 20px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 14px; min-width: 0; }
.coltitle { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 0; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.step h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.step h3 .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.step.f { border-left: 3px solid var(--filter); }
.step.v { border-left: 3px solid var(--vec); }
.step p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); }
pre.code { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; background: var(--sunken); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.k-f { color: var(--filter); font-weight: 600; }
.k-v { color: var(--vec); font-weight: 600; }

/* tree */
ul.tree, ul.tree ul { list-style: none; margin: 0; padding-left: 16px; }
ul.tree { padding-left: 0; font-size: 13.5px; }
ul.tree li { position: relative; }
ul.tree ul li::before { content: ""; position: absolute; left: -11px; top: 0; bottom: 50%; width: 8px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.node { display: inline-flex; gap: 6px; align-items: baseline; padding: 1px 6px; border-radius: 5px; color: var(--muted); }
.node .kind { font-family: var(--font-mono); font-size: 10.5px; color: var(--dim); }
.node .id { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
.node.in { color: var(--fg); background: var(--filter-soft); }
.node.hit { color: var(--filter); background: var(--filter-soft); font-weight: 700; outline: 1px solid var(--filter); }
.tree.plain .node { color: var(--fg); }

/* vector bars */
.vbars { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.vbars .lab { color: var(--muted); white-space: nowrap; }
.vbars .track { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.vbars .bar { height: 100%; background: var(--vec); border-radius: 4px; }
.vbars .val { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

/* results */
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { flex: 1 1 160px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stat .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .cap { font-size: 12.5px; color: var(--muted); }
.stat.v .big { color: var(--vec); }
.stat.k .big { color: var(--muted); }
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.result.low { opacity: .55; }
.rhead { display: flex; gap: 10px; justify-content: space-between; align-items: start; }
.rtitle { font-weight: 700; font-size: 16px; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.badge { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.crumb { font-size: 12.5px; color: var(--filter); }
.score { text-align: right; flex: none; }
.score .num { font-family: var(--font-mono); font-weight: 600; color: var(--vec); font-variant-numeric: tabular-nums; }
.score .lab { display: block; font-size: 11px; color: var(--muted); }
.scorebar { height: 4px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.scorebar div { height: 100%; background: var(--vec); }
.snippet { font-size: 14px; background: var(--sunken); border-radius: 8px; padding: 8px 12px; margin: 0; }
.snippet .src { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--dim); margin-bottom: 2px; }
mark { background: var(--vec-soft); color: var(--vec); font-weight: 700; border-radius: 3px; padding: 0 2px; }
.linkbtn { justify-self: start; font: inherit; font-size: 13px; border: 1px solid var(--line); background: none; color: var(--accent); padding: 3px 10px; border-radius: 7px; cursor: pointer; }
.divider { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }

/* data tab */
.section { margin-top: 28px; }
.section h2 { font-size: 18px; margin: 0 0 4px; }
.section > p { margin: 0 0 12px; color: var(--muted); font-size: 14px; max-width: 70ch; }
.schemas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.schema { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.schema h4 { margin: 0; padding: 8px 12px; font-family: var(--font-mono); font-size: 14px; background: var(--sunken); display: flex; justify-content: space-between; }
.schema h4 span { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.schema dl { margin: 0; padding: 8px 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.schema dt { font-family: var(--font-mono); }
.schema dd { margin: 0; color: var(--muted); }
.fk { color: var(--filter); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; max-height: 520px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--sunken); font-family: var(--font-mono); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.mono { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.heat { display: inline-flex; gap: 2px; }
.heat i { width: 12px; height: 16px; border-radius: 2px; background: var(--vec); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: 85vh; }
dialog::backdrop { background: rgb(10 12 20 / .5); }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.dhead h3 { margin: 0; font-size: 16px; }
.dbody { padding: 12px 16px 16px; display: grid; gap: 12px; }
.dbody h4 { margin: 0 0 4px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .result { animation: rise .25s ease both; } @keyframes rise { from { transform: translateY(4px); } } }
</style>

</div>

  { k: "攜帶性", terms: { "重量": 1, "輕薄": 1, "kg": .6, "攜帶": .8, "厚度": .7 } },
  { k: "輸入裝置", terms: { "鍵盤": 1, "觸控板": .8, "觸控筆": .8, "手寫": .6 } },
  { k: "多工效率", terms: { "多工": 1, "生產力": .8, "分割": .6, "延伸": .5, "並排": .6 } },
  { k: "散熱", terms: { "散熱": 1, "溫度": .8, "風扇": .8, "均熱板": 1, "降頻": .8, "噪音": .5, "過熱": 1 } },
  { k: "連接擴充", terms: { "thunderbolt": 1, "usb4": 1, "pcie": .8, "wi-fi": .7, "插槽": .6, "連接埠": 1, "hdmi": .6, "外接": .6 } },
];

const DOC_TYPE_RULES = [
  { words: ["組態", "設定", "bios", "config"], types: ["config", "manual"] },
  { words: ["規格", "spec", "datasheet"], types: ["datasheet"] },
  { words: ["路線圖", "roadmap", "發展", "趨勢"], types: ["roadmap", "whitepaper"] },
  { words: ["白皮書"], types: ["whitepaper"] },
  { words: ["測試", "評測", "跑分", "benchmark"], types: ["test_report"] },
  { words: ["手冊", "說明書", "manual"], types: ["manual"] },
];
const STOPWORDS = ["有沒有", "哪些", "推薦", "可以", "底下", "相關", "有關", "關於", "所有", "文件", "資料", "搜尋", "報告", "的", "帶", "有", "找", "年"];
const EXAMPLES = ["帶小螢幕的筆電", "2026年CPU發展", "Core Ultra 200 底下的組態文件", "可以折疊的筆電", "RTX 50 散熱", "Snapdragon 續航", "主機板 BIOS 設定", "顯卡 測試報告", "2026 筆電發展", "省電 續航"];
const RELEVANT = 0.4;

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const kids = id => PRODUCTS.filter(p => p.parent_id === id);
const subtree = id => [id, ...kids(id).flatMap(k => subtree(k.id))];
const ancestors = id => { const a = []; for (let p = byId[id]; p; p = byId[p.parent_id]) a.push(p.id); return a; };
const pathOf = id => ancestors(id).reverse().map(i => byId[i].name).join(" › ");
const count = (t, term) => t.split(term).length - 1;
const norm = v => Math.hypot(...v);
function embed(text) {
  const t = text.toLowerCase();
  const raw = DIMS.map(d => Object.entries(d.terms).reduce((s, [term, w]) => s + w * count(t, term), 0));
  const n = norm(raw);
  return raw.map(x => n ? +(x / n).toFixed(3) : 0);
}
const cos = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0); // 已正規化
let cid = 0;
const CHUNKS = DOCS.flatMap(d => d.chunks.map((content, i) => ({ id: ++cid, document_id: d.id, chunk_index: i, content, embedding: embed(content) })));
const DOC_PRODUCT = DOCS.flatMap(d => d.products.map(p => ({ document_id: d.id, product_id: p })));

// ---------- 模擬 LLM：把一句話拆成結構化條件 + 語意 ----------
function parse(q) {
  const lower = q.toLowerCase();
  let rem = lower;
  const ym = rem.match(/(20\d{2})\s*年?/);
  const year = ym ? +ym[1] : null;
  if (ym) rem = rem.replace(ym[0], " ");

  const groups = {};
  for (const p of PRODUCTS) for (const term of [p.name.toLowerCase(), ...(p.aliases || [])])
    if (lower.includes(term)) (groups[term] ||= new Set()).add(p.id);
  for (const term of Object.keys(groups).sort((a, b) => b.length - a.length)) rem = rem.split(term).join(" ");

  const gs = Object.values(groups);
  const all = [...new Set(gs.flatMap(g => [...g]))];
  // 每個比對到的詞都要成立：Intel + CPU → 只留 Intel 底下的 CPU
  const nodes = all.filter(n => gs.every(g => ancestors(n).some(a => g.has(a))))
                   .filter((n, _, arr) => !arr.some(m => m !== n && ancestors(m).includes(n)));

  const doc_types = [...new Set(DOC_TYPE_RULES.filter(r => r.words.some(w => lower.includes(w))).flatMap(r => r.types))];
  for (const w of STOPWORDS) rem = rem.split(w).join(" ");
  const semantic = rem.replace(/[\s,，、。?？!！]+/g, " ").trim();
  return { products: nodes.map(n => pathOf(n)), _nodes: nodes, _terms: Object.keys(groups), year, doc_types, semantic };
}

function search(q) {
  const P = parse(q);
  const nodeSet = P._nodes.length ? new Set(P._nodes.flatMap(subtree)) : null;
  const pass = d => (!nodeSet || d.products.some(p => nodeSet.has(p)))
    && (!P.year || d.published.startsWith(String(P.year)))
    && (!P.doc_types.length || P.doc_types.includes(d.doc_type));
  const filtered = DOCS.filter(pass);
  const qv = embed(P.semantic);
  const hasSem = qv.some(x => x);
  const scored = filtered.map(d => {
    const cs = CHUNKS.filter(c => c.document_id === d.id).map(c => ({ c, s: hasSem ? cos(qv, c.embedding) : null }));
    cs.sort((a, b) => (b.s ?? 0) - (a.s ?? 0));
    return { d, best: cs[0].c, score: cs[0].s };
  }).sort((a, b) => (b.score ?? 0) - (a.score ?? 0) || b.d.published.localeCompare(a.d.published));
  const kw = P.semantic.replace(/\s+/g, "");
  const keywordHits = kw ? filtered.filter(d => d.chunks.some(c => c.toLowerCase().includes(kw))).length : null;
  return { P, nodeSet, filtered, qv, hasSem, scored, kw, keywordHits };
}

// ---------- 畫面 ----------
function treeHTML(nodeSet, hits, plain) {
  const docCount = id => DOC_PRODUCT.filter(r => r.product_id === id).length;
  const li = p => {
    const cls = hits?.includes(p.id) ? "hit" : nodeSet?.has(p.id) ? "in" : "";
    const ch = kids(p.id);
    const dc = plain && docCount(p.id) ? ` <span class="kind">${docCount(p.id)} 份文件</span>` : "";
    return `<li><span class="node ${cls}"><span class="id">#${p.id}</span>${esc(p.name)}<span class="kind">${p.kind}</span>${dc}</span>${ch.length ? `<ul>${ch.map(li).join("")}</ul>` : ""}</li>`;
  };
  let roots = PRODUCTS.filter(p => p.parent_id === null), more = "";
  if (!plain) { // 搜尋步驟裡只展開有符合的廠商，其餘收合成一行
    const keep = roots.filter(r => nodeSet && subtree(r.id).some(i => nodeSet.has(i)));
    const rest = roots.filter(r => !keep.includes(r));
    if (rest.length) more = `<p class="note" style="margin:6px 0 0">未符合、已收合：${rest.map(r => esc(r.name)).join("、")}</p>`;
    roots = keep;
  }
  return `<ul class="tree ${plain ? "plain" : ""}">${roots.map(li).join("")}</ul>${more}`;
}
function vbars(v) {
  return `<div class="vbars">${DIMS.map((d, i) => `<span class="lab">${d.k}</span><span class="track"><span class="bar" style="width:${Math.round(v[i] * 100)}%;display:block"></span></span><span class="val">${v[i].toFixed(2)}</span>`).join("")}</div>`;
}
function highlight(text, qv) {
  const terms = DIMS.flatMap((d, i) => qv[i] > 0 ? Object.keys(d.terms) : []).sort((a, b) => b.length - a.length);
  let out = esc(text);
  if (!terms.length) return out;
  const re = new RegExp(terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  return out.replace(re, m => `<mark>${m}</mark>`);
}
function sqlFor(r) {
  const P = r.P, L = [];
  if (P._nodes.length) L.push(`<span class="k-f">WITH RECURSIVE sub AS (\n  SELECT id FROM product WHERE id IN (${P._nodes.join(", ")})\n  UNION ALL\n  SELECT p.id FROM product p JOIN sub ON p.parent_id = sub.id\n)</span>`);
  L.push(`SELECT d.id, d.title${r.hasSem ? `,\n       <span class="k-v">MIN(c.embedding &lt;=&gt; :query_vec) AS distance</span>` : ""}\nFROM document d`);
  if (P._nodes.length) L.push(`<span class="k-f">JOIN document_product dp ON dp.document_id = d.id</span>`);
  if (r.hasSem) L.push(`<span class="k-v">JOIN chunk c ON c.document_id = d.id</span>`);
  const w = [];
  if (P._nodes.length) w.push(`<span class="k-f">dp.product_id IN (SELECT id FROM sub)</span>`);
  if (P.year) w.push(`<span class="k-f">d.published &gt;= '${P.year}-01-01' AND d.published &lt; '${P.year + 1}-01-01'</span>`);
  if (P.doc_types.length) w.push(`<span class="k-f">d.doc_type IN (${P.doc_types.map(t => `'${t}'`).join(", ")})</span>`);
  if (w.length) L.push("WHERE " + w.join("\n  AND "));
  L.push(r.hasSem ? `GROUP BY d.id, d.title\n<span class="k-v">ORDER BY distance</span>` : "ORDER BY d.published DESC");
  L.push("LIMIT 20;");
  return L.join("\n");
}

function render(q) {
  $("#q").value = q;
  const r = search(q);
  const P = r.P;
  const shown = { products: P.products, year: P.year, doc_type: P.doc_types, semantic: P.semantic || null };
  const json = JSON.stringify(shown, null, 2)
    .replace(/("products"|"year"|"doc_type")/g, '<span class="k-f">$1</span>')
    .replace(/("semantic")/g, '<span class="k-v">$1</span>');

  $("#pipeline").innerHTML = `
    <h2 class="coltitle">系統怎麼處理這句話</h2>
    <div class="step">
      <h3><span class="n">1</span>LLM 拆解查詢</h3>
      <p>把一句話拆成兩部分：能精確篩選的條件，以及要靠語意理解的描述。這裡用規則模擬 LLM 的輸出。</p>
      <pre class="code">${json}</pre>
    </div>
    <div class="step f">
      <h3><span class="n">2</span>產品樹展開</h3>
      <p>${P._nodes.length ? `比對到 <b>${P._nodes.length}</b> 個節點，往下展開共 <b>${r.nodeSet.size}</b> 個產品。文件只要掛在其中任一個，就算符合。` : "查詢沒有提到產品，所以不篩產品。"}</p>
      ${treeHTML(r.nodeSet, P._nodes)}
    </div>
    <div class="step">
      <h3><span class="n">3</span>產生 SQL</h3>
      <pre class="code">${sqlFor(r)}</pre>
    </div>
    <div class="step v">
      <h3><span class="n">4</span>查詢文字轉成向量</h3>
      ${r.hasSem ? `<p>「${esc(P.semantic)}」被轉成下面這組數字，再和每個段落的向量比較方向是否接近（cosine 相似度）。真實模型有 1024 維，這裡用 ${DIMS.length} 個看得懂的維度示意。</p>${vbars(r.qv)}`
        : `<p>${P.semantic ? `「${esc(P.semantic)}」不在示範詞庫裡，所以向量是零，結果只依日期排序。` : "篩選條件已經說完整個查詢，不需要語意排序，結果依日期排序。"}</p>`}
    </div>`;

  const rel = r.scored.filter(x => !r.hasSem || x.score >= RELEVANT);
  const low = r.hasSem ? r.scored.filter(x => x.score < RELEVANT) : [];
  const card = (x, isLow) => `
    <article class="result ${isLow ? "low" : ""}">
      <div class="rhead">
        <div>
          <h3 class="rtitle">${esc(x.d.title)}</h3>
          <div class="meta"><span class="badge">${x.d.doc_type}</span><span>${x.d.published}</span>${x.d.tags.map(t => `<span>#${esc(t)}</span>`).join("")}</div>
          <div class="crumb">${x.d.products.map(pathOf).map(esc).join("<br>")}</div>
        </div>
        ${x.score !== null ? `<div class="score"><span class="num">${x.score.toFixed(2)}</span><span class="lab">語意相似度</span></div>` : ""}
      </div>
      ${x.score !== null ? `<div class="scorebar"><div style="width:${Math.max(0, x.score) * 100}%"></div></div>` : ""}
      <p class="snippet"><span class="src">chunk #${x.best.id}　最相關的段落</span>${highlight(x.best.content, r.qv)}</p>
      <button class="linkbtn" data-doc="${x.d.id}">查看資料庫原始資料</button>
    </article>`;

  $("#results").innerHTML = `
    <h2 class="coltitle">結果</h2>
    <div class="summary">
      <div class="stat"><div class="big">${DOCS.length} → ${r.filtered.length}</div><div class="cap">結構化篩選後剩下的文件</div></div>
      ${r.hasSem ? `<div class="stat v"><div class="big">${rel.length}</div><div class="cap">語意相似度 ≥ ${RELEVANT}</div></div>` : ""}
      ${r.kw ? `<div class="stat k"><div class="big">${r.keywordHits}</div><div class="cap">改用關鍵字 LIKE '%${esc(r.kw)}%'</div></div>` : ""}
    </div>
    ${rel.length ? rel.map(x => card(x, false)).join("") : `<div class="empty">沒有找到相關文件。換個說法，或點上方的範例試試。</div>`}
    ${low.length ? `<div class="divider">通過篩選，但語意不相關（${low.length}）</div>${low.slice(0, 4).map(x => card(x, true)).join("")}${low.length > 4 ? `<p class="note">另有 ${low.length - 4} 份相似度更低的文件未列出。</p>` : ""}` : ""}`;
}

function showRaw(docId) {
  const d = DOCS.find(x => x.id === docId);
  const row = { id: d.id, title: d.title, file_uri: `s3://product-docs/${d.id}.pdf`, doc_type: d.doc_type, published: d.published, tags: d.tags };
  const fmt = o => esc(JSON.stringify(o, null, 2).replace(/\[\s+([-\d.,\s]+?)\s+\]/g, (_, a) => "[" + a.replace(/\s+/g, " ") + "]"));
  $("#rawtitle").textContent = d.title;
  $("#rawbody").innerHTML = `
    <p class="note">這份文件在資料庫裡實際長這樣。PDF 本體不進資料庫，只記 file_uri。</p>
    <div><h4>document（1 列）</h4><pre class="code">${fmt(row)}</pre></div>
    <div><h4>document_product（${d.products.length} 列）</h4><pre class="code">${fmt(DOC_PRODUCT.filter(r => r.document_id === d.id).map(r => ({ ...r, "// 產品": pathOf(r.product_id) })))}</pre></div>
    <div><h4>chunk（${d.chunks.length} 列）</h4><pre class="code">${fmt(CHUNKS.filter(c => c.document_id === d.id))}</pre></div>`;
  $("#raw").showModal();
}

function renderData() {
  const table = (cols, rows) => `<div class="tablebox"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c[2] || ""}">${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const heat = v => `<span class="heat" title="${v.join(", ")}">${v.map(x => `<i style="opacity:${(0.08 + x * 0.92).toFixed(2)}"></i>`).join("")}</span>`;
  $("#view-data").innerHTML = `
    <section class="section">
      <h2>四張表</h2>
      <p>檔案本體放在 NAS 或 S3，資料庫只記「去哪裡找」。分類靠產品樹加上多對多的對應表，搜尋則靠 chunk 上的向量。</p>
      <div class="schemas">
        <div class="schema"><h4>product <span>產品樹 · ${PRODUCTS.length} 列</span></h4><dl>
          <dt>id</dt><dd>主鍵</dd><dt class="fk">parent_id</dt><dd>上一層產品，最上層為 null</dd><dt>name</dt><dd>Intel、CPU、Core Ultra 9 285K</dd><dt>kind</dt><dd>vendor / category / series / sku</dd></dl></div>
        <div class="schema"><h4>document <span>文件 · ${DOCS.length} 列</span></h4><dl>
          <dt>id</dt><dd>主鍵</dd><dt>title</dt><dd>標題</dd><dt>file_uri</dt><dd>檔案在 S3 / NAS 的位置</dd><dt>doc_type</dt><dd>config / datasheet / roadmap / whitepaper</dd><dt>published</dt><dd>發布日期</dd><dt>tags</dt><dd>LLM 自動產生，選填</dd></dl></div>
        <div class="schema"><h4>document_product <span>對應 · ${DOC_PRODUCT.length} 列</span></h4><dl>
          <dt class="fk">document_id</dt><dd>→ document.id</dd><dt class="fk">product_id</dt><dd>→ product.id</dd></dl>
          <dl><dd style="grid-column:1/-1">一份文件可掛多個產品，例如「AI PC 趨勢報告」同時掛在 Intel CPU、AMD CPU 與兩個筆電分類。</dd></dl></div>
        <div class="schema"><h4>chunk <span>段落 · ${CHUNKS.length} 列</span></h4><dl>
          <dt class="fk">document_id</dt><dd>→ document.id</dd><dt>chunk_index</dt><dd>第幾段</dd><dt>content</dt><dd>原文段落</dd><dt>embedding</dt><dd>向量（真實為 vector(1024)）</dd></dl></div>
      </div>
    </section>
    <section class="section">
      <h2>product：產品樹</h2>
      <p>每列只記自己的上一層。查「CPU 底下」時，系統沿 parent_id 往下展開，所以文件不必重複標記 Intel、CPU。</p>
      <div class="twocol">
        <div class="step">${treeHTML(null, null, true)}</div>
        ${table([["id", r => r.id, "mono"], ["parent_id", r => r.parent_id ?? "null", "mono"], ["name", r => esc(r.name)], ["kind", r => r.kind, "mono"]], PRODUCTS)}
      </div>
    </section>
    <section class="section">
      <h2>document</h2>
      ${table([["id", r => r.id, "mono"], ["title", r => esc(r.title)], ["doc_type", r => r.doc_type, "mono"], ["published", r => r.published, "mono"], ["file_uri", r => `s3://product-docs/${r.id}.pdf`, "mono"], ["tags", r => r.tags.map(esc).join(", ")]], DOCS)}
    </section>
    <section class="section">
      <h2>document_product</h2>
      ${table([["document_id", r => r.document_id, "mono"], ["product_id", r => r.product_id, "mono"], ["// 對應到", r => `${esc(DOCS.find(d => d.id === r.document_id).title)} → ${esc(pathOf(r.product_id))}`]], DOC_PRODUCT)}
    </section>
    <section class="section">
      <h2>chunk</h2>
      <p>每段文字各自轉成向量。下方色塊依序是 ${DIMS.length} 個示範維度（${DIMS.map(d => d.k).join("、")}），顏色越深代表該概念越強。真實 embedding 有 1024 維，數字無法直接解讀。</p>
      ${table([["id", r => r.id, "mono"], ["document_id", r => r.document_id, "mono"], ["content", r => esc(r.content)], ["embedding", r => heat(r.embedding)]], CHUNKS)}
    </section>`;
}

// ---------- 事件 ----------
$("#chips").insertAdjacentHTML("beforeend", EXAMPLES.map(e => `<button type="button" class="chip">${esc(e)}</button>`).join(""));
$("#chips").addEventListener("click", e => { if (e.target.classList.contains("chip")) render(e.target.textContent); });
$("#form").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) render(q); });
$("#results").addEventListener("click", e => { const b = e.target.closest("[data-doc]"); if (b) showRaw(+b.dataset.doc); });
$("#rawclose").addEventListener("click", () => $("#raw").close());
$("#raw").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

function show(view) {
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.view === view);
  $("#view-search").hidden = view !== "search";
  $("#view-data").hidden = view !== "data";
}
document.querySelector(".tabs").addEventListener("click", e => { const v = e.target.dataset?.view; if (v) { location.hash = v; show(v); } });
window.addEventListener("hashchange", () => show(location.hash === "#data" ? "data" : "search"));

renderData();
render(EXAMPLES[0]);
show(location.hash === "#data" ? "data" : "search");
</script>
